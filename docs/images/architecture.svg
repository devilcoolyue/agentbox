    .subtitle { font-size: 21px; fill: #bdb5a8; }
    .lane { font-size: 16px; font-weight: 600; letter-spacing: 1.2px; fill: #bdb5a8; }
    .heading { font-size: 24px; font-weight: 600; letter-spacing: -.35px; }
