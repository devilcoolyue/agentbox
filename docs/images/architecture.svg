<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="872" viewBox="0 0 1280 872" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Your agents. Your infrastructure. — agentbox</title>
<desc id="desc">A browser or optional desktop client connects to the agentbox Go server over HTTPS and WebSocket. The Linux host runs a local Docker engine with one workspace container running Claude Code or Codex. The CLI calls model APIs, optionally through an account egress proxy. SQLite, chat history and workspace, home and shared directories persist on the host. Optional abox-link initiates an outbound tunnel from the user&#x27;s computer to the server. Workspace requests pass through the server and tunnel to services allowed by the local client.</desc>
