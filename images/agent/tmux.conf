# agentbox 网页终端的 tmux 配置：tmux 只作"断线续接"的载体，尽量隐形——
# 用户看到的应当就是一个普通终端，感知不到 tmux 存在。

# 无状态栏、无前缀键：Ctrl+B 等按键原样透传给 claude/codex 等 TUI
set -g status off
set -g prefix None
set -g prefix2 None

# 内层 TERM 与真彩：镜像 ncurses-base 自带 tmux-256color 词条
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ESC 不等待(TUI 里按 Esc 无延迟)；焦点事件透传(claude 会用)
set -s escape-time 10
set -g focus-events on

# 滚轮在 shell 里滚 tmux 历史、在 TUI 里透传给应用；选中文本按住 Shift 拖动
# 即回到浏览器原生选区(xterm.js 行为)
set -g mouse on
set -g history-limit 50000

# external：tmux 自己的复制（shell 里拖选、双击选词、三击选行）经 OSC52 交给 xterm，
# 由网页的 term-clipboard.ts 写进剪贴板；off 时只进 tmux 缓冲区，用户拿不到。
# 程序直接打印的 OSC52 照样不转发（只有 on 才收），cat 一个文件改不了用户本机的剪贴板。
# `tmux load-buffer -w`（Claude Code 复制时用）不受此项影响。
# 网页「Agent 镜像更新」不会重新拷这个文件，老镜像和已在跑的 tmux 也还是 off，
# 所以服务端每次接入终端时再设一遍（termws.go 的 tmuxClipboard），两处要一致
set -s set-clipboard external

# 与旧行为一致：普通交互 bash（tmux 默认起 login shell，这里改回来）
set -g default-command "exec bash"
