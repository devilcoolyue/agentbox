name: Release candidate

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate tag matches a reviewed release commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          test -f LICENSE
      - name: Validate Go
        run: |
          set -o pipefail
          go build ./...
          go list -f '{{if ne .ImportPath "agentbox/internal/server"}}{{.ImportPath}}{{end}}' ./... | xargs -r go test
          AGENTBOX_CHOWN_DENIAL_TEST=1 go test ./internal/server -run '^TestSyncMutationLinuxChownDeniedPreservesTarget$' -count=1 -v
          # Build as the runner; only the server test process needs production UID/GID permissions.
          go test -exec 'sudo -n --' ./internal/server -count=1
          go vet ./...
      - name: Validate installer
        run: |
          bash -n install.sh uninstall.sh
          python3 scripts/test-browser-runtime.py
          python3 scripts/test-install.py
          python3 scripts/test-uninstall.py
          python3 scripts/test-deployment.py
          python3 scripts/test-update.py
      - name: Build candidates
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build-release.py --version "$RELEASE_TAG" --output "$RUNNER_TEMP/release"
      - name: Verify archives and Linux installation
        run: python3 scripts/test-release.py "$RUNNER_TEMP/release"
      - name: Build pinned runtime and test synthetic session
        run: |
          ./scripts/build-image.sh
          python3 scripts/verify.py run --step docker.cli-candidate --image agentbox-agent:latest --timeout 300 --report-dir output/verification/cli-candidate
          python3 scripts/test-release-server.py "$RUNNER_TEMP/release" --image agentbox-agent:latest --usage --restart
      - name: Independent deployment migration and rollback (simulated systemd)
        run: |
          go build -o "$RUNNER_TEMP/agentbox-deployment" ./cmd/agentbox
          python3 scripts/test-deployment-linux.py --binary "$RUNNER_TEMP/agentbox-deployment" --image agentbox-agent:latest
          python3 scripts/test-install-linux.py --binary "$RUNNER_TEMP/agentbox-deployment" --image agentbox-agent:latest
      - name: Real systemd upgrade and measured recovery on synthetic data
        run: |
          docker build -t agentbox-recovery-systemd:ci scripts/fixtures/recovery-drill
          python3 scripts/verify.py run --step docker.recovery-drill --recovery-image agentbox-recovery-systemd:ci --timeout 600 --report-dir output/verification/recovery
      - name: Preserve real recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-recovery-verification
          path: |
            output/verification/recovery/
            output/verification/recovery-drill-*/
          if-no-files-found: warn
      - name: Preserve candidate CLI validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-candidate-verification
          path: output/verification/cli-candidate/
          if-no-files-found: warn
      - name: Scan history and candidates
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          python3 scripts/scan-secrets.py --artifacts "$RUNNER_TEMP/release" --output "$RUNNER_TEMP/secret-audit"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14
# Deliberately produces reviewable artifacts only. Creating a public GitHub
# Release and uploading it is the project owner's separate publication action.
