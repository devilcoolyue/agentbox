name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 前端产物 internal/web/static/js 提交进仓库（生产机只有 Go 工具链，deploy.sh
  # 不跑 npm）。这里重新编译并比较产物集合与字节，挡住「改了 .ts 忘记 build」
  # 导致部署出去还是旧脚本的情况。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci
      - name: Web types, generated artifacts and contracts
        run: python3 scripts/verify.py run web --report-dir output/verification/web

      - name: Browser lifecycle regression (synthetic API)
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          python3 scripts/verify.py run browser --playwright-module "$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" --report-dir output/verification/browser
      - name: Preserve web verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-web
          path: output/verification/
          if-no-files-found: warn

  # 同一批核心场景（主控制台、首次使用、草稿、待确认发送）在 WebKit 中再跑一遍，
  # 断言不变；不替代真机 Safari / iOS。
  web-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci
      - name: Core browser scenarios in WebKit (synthetic API)
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps webkit
          python3 scripts/verify.py run browser-webkit --playwright-module "$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" --report-dir output/verification/browser-webkit
      - name: Preserve WebKit verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-web-webkit
          path: output/verification/
          if-no-files-found: warn

  chat-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser and isolated Linux test base
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          docker pull alpine:3.22
      - name: Real server and browser reliability (synthetic CLI, no paid models)
        run: |
          python3 scripts/verify.py run linux-integration --image alpine:3.22 --playwright-module "$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" --timeout 600 --report-dir output/verification/chat-reliability
      - name: Preserve reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-chat-reliability
          path: |
            output/verification/chat-reliability/
            output/playwright/chat-integration-*/
          if-no-files-found: warn

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go build, vet, unit and Linux ownership gates
        run: python3 scripts/verify.py run go --report-dir output/verification/go
      - name: Deployment and verification policy
        run: python3 scripts/verify.py run policy --report-dir output/verification/policy
      - name: Preserve Go and policy verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-go-policy
          path: output/verification/
          if-no-files-found: warn
      - name: backup and restore CLI
        run: AGENTBOX_BACKUP_DOCKER_TEST=1 ./scripts/test-backup.sh
      - name: Git container smoke (no model calls)
        run: |
          docker build -t agentbox-git-test:ci -f internal/dockerx/testdata/git.Dockerfile internal/dockerx/testdata
          AGENTBOX_DOCKER_TEST_IMAGE=agentbox-git-test:ci go test ./internal/dockerx -run '^TestGitContainerLive$' -count=1 -v
          AGENTBOX_DOCKER_TEST_IMAGE=agentbox-git-test:ci go test ./internal/server -run '^TestGitBridgeContainerLive$' -count=1 -v
      - name: cross-compile abox-link (smoke)
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/abox-link
          done

      - name: Independent desktop terminals (real Linux PTY/tmux, no model calls)
        run: |
          docker build -t agentbox-client-test:ci -f internal/server/testdata/client.Dockerfile internal/server/testdata
          AGENTBOX_CLIENT_TEST_IMAGE=agentbox-client-test:ci go test ./internal/server -run '^TestClientTerminalsContainerLive$' -count=1 -v

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 只对「代码里真正调用到」的漏洞失败，且允许在 .github/vuln-allowlist.txt
      # 里按 ID 豁免（每条都写明理由）。清单之外的漏洞照常让 CI 红，新 CVE 不会
      # 被悄悄放行。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format json ./... > vuln.json
          jq -sr '[.[] | select(.finding) | .finding
                  | select(.trace[0].function) | .osv] | unique | .[]' \
            vuln.json | sort -u > called.txt
          grep -vE '^\s*(#|$)' .github/vuln-allowlist.txt \
            | awk '{print $1}' | sort -u > allowed.txt

          echo "== 代码可达的漏洞 =="; cat called.txt
          echo "== 已豁免 =="; cat allowed.txt

          if comm -23 called.txt allowed.txt | grep -q .; then
            echo "::error::发现未豁免的漏洞："
            comm -23 called.txt allowed.txt
            echo "确认不影响本项目的话，把 ID 连同理由加进 .github/vuln-allowlist.txt"
            exit 1
          fi
          echo "没有未豁免的漏洞。"

  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify image policy and bundled licenses
        run: python3 scripts/verify.py run --step policy.image-policy --step audit.licenses --report-dir output/verification/audit
      - name: Preserve source verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-source
          path: output/verification/
          if-no-files-found: warn
      - name: Scan fetched history and tracked files
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          python3 scripts/scan-secrets.py --output "$RUNNER_TEMP/secret-audit"
