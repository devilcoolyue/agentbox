name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 前端产物 internal/web/static/js 提交进仓库（生产机只有 Go 工具链，deploy.sh
  # 不跑 npm）。这里重新编译一次并要求 git 树干净，挡住「改了 .ts 忘记 build」
  # 导致部署出去还是旧脚本的情况。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run check
      - name: build
        run: npm run build
      - name: 产物与源码一致性
        run: |
          if ! git diff --quiet -- internal/web/static/js; then
            echo "::error::internal/web/static/js 与 web/src 不一致。请在本地执行 npm run build 并提交产物。"
            git diff --stat -- internal/web/static/js
            exit 1
          fi
          echo "前端产物与源码一致。"

      - name: Browser lifecycle regression (synthetic API)
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          AGENTBOX_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" node scripts/test-browser.mjs
          AGENTBOX_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs" node scripts/test-git.mjs

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: Deployment policy
        run: |
          python3 scripts/test-browser-runtime.py
          python3 scripts/test-deployment.py
          python3 scripts/test-update.py
          bash -n install.sh
          python3 scripts/test-install.py
          python3 scripts/test-uninstall.py
      - name: backup and restore CLI
        run: AGENTBOX_BACKUP_DOCKER_TEST=1 ./scripts/test-backup.sh
      - name: Git container smoke (no model calls)
        run: |
          docker build -t agentbox-git-test:ci -f internal/dockerx/testdata/git.Dockerfile internal/dockerx/testdata
          AGENTBOX_DOCKER_TEST_IMAGE=agentbox-git-test:ci go test ./internal/dockerx -run '^TestGitContainerLive$' -count=1 -v
          AGENTBOX_DOCKER_TEST_IMAGE=agentbox-git-test:ci go test ./internal/server -run '^TestGitBridgeContainerLive$' -count=1 -v
      - name: cross-compile abox-link (smoke)
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/abox-link
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # 只对「代码里真正调用到」的漏洞失败，且允许在 .github/vuln-allowlist.txt
      # 里按 ID 豁免（每条都写明理由）。清单之外的漏洞照常让 CI 红，新 CVE 不会
      # 被悄悄放行。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format json ./... > vuln.json
          jq -sr '[.[] | select(.finding) | .finding
                  | select(.trace[0].function) | .osv] | unique | .[]' \
            vuln.json | sort -u > called.txt
          grep -vE '^\s*(#|$)' .github/vuln-allowlist.txt \
            | awk '{print $1}' | sort -u > allowed.txt

          echo "== 代码可达的漏洞 =="; cat called.txt
          echo "== 已豁免 =="; cat allowed.txt

          if comm -23 called.txt allowed.txt | grep -q .; then
            echo "::error::发现未豁免的漏洞："
            comm -23 called.txt allowed.txt
            echo "确认不影响本项目的话，把 ID 连同理由加进 .github/vuln-allowlist.txt"
            exit 1
          fi
          echo "没有未豁免的漏洞。"

  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify stable image policy
        run: python3 scripts/test-image-policy.py
      - name: Verify bundled sources and licenses
        run: python3 scripts/verify-third-party.py
      - name: Scan fetched history and tracked files
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          python3 scripts/scan-secrets.py --output "$RUNNER_TEMP/secret-audit"
