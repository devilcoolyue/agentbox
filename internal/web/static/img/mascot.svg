<!-- viewBox 顶部留 5 单位余量：天线光晕上沿正好在 y=0，boxi-bob 上浮 3.5 会被裁掉 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -5 200 173" role="img" aria-label="agentbox 吉祥物「盒仔」：站在开箱纸箱里的小机器人">
  <style>
    .boxi-bob { animation: boxi-bob 3.4s ease-in-out infinite; }
    .boxi-eye { transform-box: fill-box; transform-origin: center; animation: boxi-blink 4.6s infinite; }
    .boxi-glow { animation: boxi-glow 2.6s ease-in-out infinite; }
    @keyframes boxi-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }
    @keyframes boxi-blink { 0%, 90.5%, 94.5%, 100% { transform: scaleY(1); } 92.5% { transform: scaleY(0.12); } }
    @keyframes boxi-glow { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { .boxi-bob, .boxi-eye, .boxi-glow { animation: none; } }
  </style>
  <!-- 地面阴影 -->
  <ellipse cx="100" cy="158" rx="56" ry="7" fill="#000" opacity=".3"/>
  <!-- 外翻的左右箱盖 -->
  <path d="M53 96 L17 87 L21.5 73.5 L55 85 Z" fill="#e8a33d" stroke="#a8712a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M147 96 L183 87 L178.5 73.5 L145 85 Z" fill="#e8a33d" stroke="#a8712a" stroke-width="2" stroke-linejoin="round"/>
  <!-- 立起的后箱盖（露出两角） -->
  <path d="M58 86 L142 86 L137 60 L63 60 Z" fill="#b97b2c" stroke="#8f5f22" stroke-width="2" stroke-linejoin="round"/>
  <!-- 箱内阴影 -->
  <rect x="54" y="82" width="92" height="14" rx="3" fill="#231803"/>
  <!-- 机器人（后层：天线 / 耳钉 / 头 / 身体） -->
  <g class="boxi-bob">
    <rect x="74" y="70" width="52" height="32" rx="12" fill="#232a37" stroke="#3d4a63" stroke-width="2"/>
    <path d="M100 22 V11" stroke="#3d4a63" stroke-width="3" stroke-linecap="round"/>
    <circle class="boxi-glow" cx="100" cy="9" r="9" fill="#ffbe55" opacity=".2"/>
    <circle cx="100" cy="9" r="4.5" fill="#ffbe55"/>
    <circle cx="66" cy="47" r="5.5" fill="#e8a33d" stroke="#a8712a" stroke-width="1.5"/>
    <circle cx="134" cy="47" r="5.5" fill="#e8a33d" stroke="#a8712a" stroke-width="1.5"/>
    <rect x="68" y="22" width="64" height="50" rx="17" fill="#232a37" stroke="#3d4a63" stroke-width="2"/>
    <rect x="77" y="32" width="46" height="30" rx="10" fill="#0b0e15"/>
    <circle cx="84.5" cy="54" r="2.6" fill="#ffbe55" opacity=".22"/>
    <circle cx="115.5" cy="54" r="2.6" fill="#ffbe55" opacity=".22"/>
    <rect class="boxi-eye" x="86" y="39" width="8" height="12" rx="3.5" fill="#ffbe55"/>
    <rect class="boxi-eye" x="106" y="39" width="8" height="12" rx="3.5" fill="#ffbe55"/>
    <path d="M92.5 56 Q100 62 107.5 56" stroke="#ffbe55" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 箱体正面 + 封箱胶带 -->
  <rect x="52" y="94" width="96" height="58" rx="7" fill="#cf8f36" stroke="#a8712a" stroke-width="2"/>
  <rect x="55" y="96" width="90" height="5" rx="2.5" fill="#e8a33d"/>
  <rect x="93" y="94" width="14" height="58" fill="#f2ca7c" stroke="#d9a94f" stroke-width="1"/>
  <!-- 唛头：终端提示符 >_ -->
  <path d="M64 115 L74 123.5 L64 132" stroke="#7c5a1e" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="78" y="128.5" width="11" height="5.5" rx="2.5" fill="#7c5a1e"/>
  <!-- 运单标签 -->
  <rect x="112" y="106" width="26" height="16" rx="2" fill="#f4e8cd" stroke="#d9c9a3"/>
  <path d="M116 111 H134 M116 115 H128" stroke="#b09b6e" stroke-width="1.7" stroke-linecap="round"/>
  <!-- 扒着箱沿的两只手（前层，与机器人一起浮动） -->
  <g class="boxi-bob">
    <rect x="58" y="88" width="15" height="17" rx="7.5" fill="#232a37" stroke="#3d4a63" stroke-width="2"/>
    <rect x="127" y="88" width="15" height="17" rx="7.5" fill="#232a37" stroke="#3d4a63" stroke-width="2"/>
  </g>
</svg>
